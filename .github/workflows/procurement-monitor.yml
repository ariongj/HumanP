name: HumanPlus manual procurement archive (daily service on Hostinger)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: humanplus-procurement-monitor
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify collector logic
        run: |
          python3 -m unittest discover -s tests -p 'test_procurement_monitor.py'
          python3 -m unittest discover -s tests -p 'test_ai_procurement_report.py'
      - name: Read official public publications
        id: collect
        continue-on-error: true
        run: python3 -u scripts/procurement_monitor.py
      - name: Prepare the daily AI report when a secure key is configured
        id: report
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -u scripts/ai_procurement_report.py
      - name: Save data and source health, including partial failures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor/state.json monitor/feed.json monitor/ai-report.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update public procurement monitor'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild the existing HumanPlus panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Report incomplete source collection
        if: steps.collect.outcome != 'success' || steps.report.outcome != 'success'
        run: exit 1
