name: Test and package company workspace
on:
  push:
    paths: ['platform/**', '.github/workflows/platform.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: platform
      - run: npm test
        working-directory: platform
      - run: npm run build
        working-directory: platform
      - run: node scripts/package-release.mjs
        working-directory: platform
      - uses: actions/upload-artifact@v4
        with:
          name: humanplus-company-workspace-${{ github.sha }}
          path: platform/release/
          retention-days: 14
          if-no-files-found: error
