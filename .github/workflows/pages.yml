name: Build and publish HumanPlus
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: humanplus-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:pages
      - run: node scripts/check-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages-publish
      - name: Update the Pages publishing branch
        run: |
          rsync -a --delete --exclude=.git --exclude=.github dist-pages/ .pages-publish/
          touch .pages-publish/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > .pages-publish/SOURCE_COMMIT
          git -C .pages-publish add --all
          if ! git -C .pages-publish diff --cached --quiet; then
            git -C .pages-publish -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish HumanPlus $GITHUB_SHA"
            git -C .pages-publish push origin HEAD:gh-pages
          fi
      - name: Deploy from the authorized Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref gh-pages
